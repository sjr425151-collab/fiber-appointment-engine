<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%%TITLE%%</title>
    <meta name="description" content="%%DESCRIPTION%%" />
    <meta name="robots" content="%%ROBOTS%%" />
    <link rel="canonical" href="%%CANONICAL%%" />
    <meta name="theme-color" content="#101828" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%%SITE_NAME%%" />
    <meta property="og:title" content="%%TITLE%%" />
    <meta property="og:description" content="%%DESCRIPTION%%" />
    <meta property="og:url" content="%%CANONICAL%%" />
    <meta property="og:image" content="%%OG_IMAGE%%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%%OG_ALT%%" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%%TITLE%%" />
    <meta name="twitter:description" content="%%DESCRIPTION%%" />
    <meta name="twitter:image" content="%%OG_IMAGE%%" />

    <!--hero-preload: home page only (must match <picture> in the home page hero)-->
    <link rel="preload" as="image" type="image/webp" fetchpriority="high"
      imagesrcset="/media/tucker-hero-768.webp 768w, /media/tucker-hero-1280.webp 1280w, /media/tucker-hero-1920.webp 1920w" imagesizes="100vw" />
    <!--/hero-preload-->
    <!--%%HEAD_DATA%%-->
  </head>
  <body>
    <noscript>
      <div style="padding:16px;background:#121a33;color:#e2e8f0;font-family:system-ui,sans-serif">
        Tucker needs JavaScript to build your savings preview. Please turn it on and reload.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
