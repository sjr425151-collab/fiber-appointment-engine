<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%%TITLE%%</title>
    <meta name="description" content="%%DESCRIPTION%%" />
    <meta name="robots" content="%%ROBOTS%%" />
    <link rel="canonical" href="%%CANONICAL%%" />
    <meta name="theme-color" content="#060914" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%%SITE_NAME%%" />
    <meta property="og:title" content="%%TITLE%%" />
    <meta property="og:description" content="%%DESCRIPTION%%" />
    <meta property="og:url" content="%%CANONICAL%%" />
    <meta property="og:image" content="%%OG_IMAGE%%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fiber-optic light streams connecting homes across a small town at dusk" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%%TITLE%%" />
    <meta name="twitter:description" content="%%DESCRIPTION%%" />
    <meta name="twitter:image" content="%%OG_IMAGE%%" />

    <!-- LCP: hero poster, art-directed per viewport (must match <picture> in HeroMedia) -->
    <link rel="preload" as="image" type="image/avif" fetchpriority="high" media="(max-width: 767px) and (orientation: portrait)"
      imagesrcset="/media/poster-mobile-480.avif 480w, /media/poster-mobile.avif 720w" imagesizes="100vw" />
    <link rel="preload" as="image" type="image/avif" fetchpriority="high" media="(min-width: 768px), (orientation: landscape)"
      imagesrcset="/media/poster-768.avif 768w, /media/poster-1280.avif 1280w, /media/poster-1920.avif 1920w" imagesizes="100vw" />
    <!--%%HEAD_DATA%%-->
  </head>
  <body>
    <noscript>
      <div style="padding:16px;background:#121a33;color:#e2e8f0;font-family:system-ui,sans-serif">
        This site needs JavaScript to check availability and book appointments.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
