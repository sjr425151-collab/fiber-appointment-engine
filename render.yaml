# One-click deploy on Render (render.com → New → Blueprint → pick this repo).
# Render builds the Dockerfile, keeps the leads database on a persistent disk,
# issues free HTTPS certificates and redeploys on every push to the branch.
# Schema: https://render.com/schema/render.yaml.json
services:
  - type: web
    name: fiber-connect
    runtime: docker
    plan: starter            # always-on (free instances sleep and can't keep a disk)
    region: ohio             # closest region to Michigan
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: fiber-data
      mountPath: /data       # SQLite database lives here and survives deploys
      sizeGB: 1
    domains:
      - trytucker.com        # canonical domain; Render also adds www.trytucker.com → redirect
      - livefiberconnect.com # previous domain, kept attached so its links can redirect (see docs/14-domain-migration.md)
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/fiber.db
      - key: SITE_URL
        value: https://trytucker.com   # canonical origin: canonical links, sitemap, share data, email links
      - key: LEGACY_HOSTS
        value: livefiberconnect.com,www.livefiberconnect.com
      - key: LEGACY_REDIRECTS
        value: "false"       # set to "true" only after trytucker.com is verified (docs/14-domain-migration.md)
      - key: TRUST_PROXY
        value: "1"
      - key: APP_TIMEZONE
        value: America/Detroit
      - key: SESSION_SECRET
        generateValue: true  # random 256-bit secret created by Render
      - key: ADMIN_EMAIL
        sync: false          # Render asks for this during setup
      - key: ADMIN_PASSWORD
        sync: false          # Render asks for this during setup (12+ characters)
      - key: RESEND_API_KEY
        sync: false          # from resend.com → API Keys (leave blank to log emails instead of sending)
      - key: EMAIL_FROM
        value: Tucker <hello@mail.trytucker.com>  # domain must be verified in Resend before a key is added
      - key: TEAM_NOTIFY_EMAIL
        sync: false          # where lead/booking alerts go if a location has no team email set
